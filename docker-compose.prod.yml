# Production compose — deploy root: /var/www/production/crm
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-crm}
      MYSQL_USER: ${DB_USERNAME:-crm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - crm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - crm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: crm-app:prod
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    image: crm-web:prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CRM_PORT:-8070}:80"
    depends_on:
      - app

  queue:
    image: crm-app:prod
    restart: unless-stopped
    entrypoint: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    image: crm-app:prod
    restart: unless-stopped
    entrypoint: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  crm-mysql-data:
  crm-redis-data:
