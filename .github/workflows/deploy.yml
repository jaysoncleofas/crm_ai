name: Deploy

# Deploys Jayson CRM on push to main.
#
# Preferred: self-hosted runner on the VPS (no inbound SSH from GitHub).
# One-time setup on the server (when you can SSH in):
#   GitHub → crm_ai → Settings → Actions → Runners → New self-hosted runner
#   export RUNNER_REGISTRATION_TOKEN='…'
#   bash deploy/scripts/install-github-runner.sh
#
# Fallback: SSH deploy (deploy-ssh.yml) only works if port 22 is reachable from
# GitHub Actions runners — often blocked by firewall / offline VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-crm-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, jayson-vps]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy on server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CLONE_TOKEN: ${{ secrets.GIT_CLONE_TOKEN }}
        run: bash deploy/scripts/deploy-from-ci.sh
