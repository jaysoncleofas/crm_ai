# crm.jaysoncleofas.com -> CRM web container on 127.0.0.1:8070
#
# Install (from deploy root on the server):
#   cp deploy/nginx/crm.conf /etc/nginx/sites-available/crm
#   cp deploy/nginx/crm-security.conf /etc/nginx/snippets/crm-security.conf
#   ln -sf /etc/nginx/sites-available/crm /etc/nginx/sites-enabled/crm
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d crm.jaysoncleofas.com

upstream crm_app {
    server 127.0.0.1:8070;
    keepalive 16;
}

server {
    server_name crm.jaysoncleofas.com;

    client_max_body_size 24m;

    include snippets/crm-security.conf;

    # Vite-built assets are fingerprinted — safe to cache long-term.
    location /build/ {
        proxy_pass http://crm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include snippets/crm-security.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://crm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_flags ~ secure;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen 80;
    listen [::]:80;
}
